name: Documentation site

on:
  push:
    branches: [ main ]
    paths:
      - "docs/doxygen/html/**"
      - "docs/site/**"
      - "Doxyfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Doxygen HTML
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add stable report links
        run: |
          cp docs/site/.nojekyll docs/doxygen/html/.nojekyll
          cp docs/site/coverage.html docs/doxygen/html/coverage.html
          cp docs/site/loc.html docs/doxygen/html/loc.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/doxygen/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
